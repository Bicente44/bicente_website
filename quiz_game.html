<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8"/>
    <title>Quiz Game</title>
	<meta name="viewport" content="width=device-width,initial-scale=1"/>
    <link rel="stylesheet" href="https://unpkg.com/@xterm/xterm/css/xterm.css" />
	
	<!-- Bootstrap 5 CSS -->
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
	<!-- Compiled site CSS -->
	<link rel="stylesheet" href="{{ '/assets/main.css' | relative_url }}">
	<!-- Bootstrap JS bundle Popper -->
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>

	<!-- Fonts -->
	<link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
    body {
      background: #111;
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #terminal { width: 800px; height: 500px; }
    .terminal-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    #restart {
      font-family: monospace;
      font-size: 14px;
      padding: 8px 16px;
      background: #222;
      color: #eee;
      border: 1px solid #555;
      cursor: pointer;
    }
    #restart:hover { background: #333; }
    </style>
</head>
<body class="min-vh-100 d-flex flex-column">

	{% include header.html %}

	<div class="flex-fill container-fluid" style="max-width: 850px; padding: 20px;">
        <div class="terminal-wrap">
            <div id="terminal"></div>
            <button id="restart">Restart</button>
        </div>
        <script type="module">
            import { Terminal } from "https://esm.sh/@xterm/xterm@5.5.0";
            import { openpty } from "https://esm.sh/xterm-pty@0.12.0";
            import initEmscripten from "{{ '/assets/emulator/quiz_game/quiz_game.mjs' | relative_url }}";

            const xterm = new Terminal({ cursorBlink: true });
            xterm.open(document.getElementById('terminal'));

            const { master, slave } = openpty();
            xterm.loadAddon(master);

            const Module = {
                pty: slave,
                locateFile: function(path) {
                    return '{{ "/assets/emulator/quiz_game/" | relative_url }}' + path;
                }
            };

            initEmscripten(Module).catch(e => {
                console.error('main() error:', e);
                xterm.writeln('\r\n[program exited unexpectedly]');
            });

            document.getElementById('restart').onclick = () => location.reload();
        </script>
    </div>
</body>
</html>
